name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK（/usr/local/lib/android/sdk），但 sdkmanager
      # 不在 PATH 且版本目录名会变；这里自行定位，避免依赖会安装已下架 tools 包的第三方 action。
      - name: Set up Android SDK 35
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then SDKM="$SDK/tools/bin/sdkmanager"; fi
          echo "ANDROID_HOME=$SDK" | tee -a "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdkmanager=$SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperMaterialUnleashed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Release 附件在发版时手动上传带版本号的 APK / 源码包并撰写中文说明，
      # CI 不再附加 app-release.apk，避免 Release 里出现两个 APK。
